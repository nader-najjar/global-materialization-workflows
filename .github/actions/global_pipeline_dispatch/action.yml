name: Global Pipeline Dispatch
description: Placeholder; builds with Universal Build and fails until materialization is implemented

inputs:
  materializer_repository:
    description: Pipeline repository in owner/repository format
    required: true
  source_repository:
    description: Source repository in owner/repository format
    required: true
  source_sha:
    description: Full source commit SHA
    required: true
  token:
    description: Token with Actions write access to the pipeline repository
    required: true

outputs:
  run_id:
    description: Exact central workflow run ID returned by dispatch
    value: ${{ steps.dispatch.outputs.run_id }}
  run_url:
    description: Central workflow run URL
    value: ${{ steps.dispatch.outputs.run_url }}

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
    - run: ./universal-build build
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
    - id: dispatch
      run: ./build/release/symlink-to-absolute-ignite-script/bin/ignite "$PWD/build/release/idiomatic-artifacts"
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
