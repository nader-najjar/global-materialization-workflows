name: Global Source Selection
description: Save one source revision or rebuild the materializer's saved snapshot

inputs:
  bounce:
    description: Rebuild saved pins without changing them
    required: true
  source_repository:
    description: Registered source repository to update unless bouncing
    required: false
  source_sha:
    description: Full source commit SHA to save unless bouncing
    required: false

outputs:
  builds:
    description: Build matrix for the registered source repositories
    value: ${{ steps.global-source-selection.outputs.builds }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13.9'
    - id: global-source-selection
      run: python "$GITHUB_ACTION_PATH/select_sources.py"
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BOUNCE: ${{ inputs.bounce }}
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        GH_TOKEN: ${{ github.token }}
