name: Internal Source Selection
description: Derive the build matrix from an owned immutable pin set

inputs:
  snapshot_sha:
    description: Immutable pin-set commit supplied by the launcher
    required: true

outputs:
  builds:
    description: Build matrix derived from the pinned software definition
    value: ${{ steps.internal-source-selection.outputs.builds }}
  selection_attempt:
    description: Execution attempt in which the matrix was generated
    value: ${{ steps.internal-source-selection.outputs.selection_attempt }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.sha }}
        sparse-checkout: .github/repositories.json
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-version: '1.29.0'
        bazelisk-cache: true
        repository-cache: true
        disk-cache: true
        module-root: ${{ github.action_path }}/../../..
    - id: internal-source-selection
      run: bazel run //:build_matrix
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        SELECTION_PATH: ${{ runner.temp }}/pipeline-selection.json
        GH_TOKEN: ${{ github.token }}
