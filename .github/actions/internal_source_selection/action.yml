name: Internal Source Selection
description: Placeholder; builds with Universal Build and fails until materialization is implemented

inputs:
  snapshot_sha:
    description: Immutable pin-set commit supplied by the launcher
    required: true

outputs:
  builds:
    description: Build matrix derived from the pinned software definition
    value: ${{ steps.internal-source-selection.outputs.builds }}
  selection_attempt:
    description: Execution attempt in which the matrix was generated
    value: ${{ steps.internal-source-selection.outputs.selection_attempt }}

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
    - run: ./universal-build build
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
    - id: internal-source-selection
      run: ./build/release/symlink-to-absolute-ignite-script/bin/ignite "$PWD/build/release/idiomatic-artifacts"
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
