name: Global Ignition
description: Select a pinned snapshot and hold product ownership through its execution

inputs:
  selection_mode:
    description: materialize, dry_run, or bounce
    required: true
  source_repository:
    description: Source repository to pin; omit for bounce
    required: false
  source_sha:
    description: Full source commit SHA; omit for bounce
    required: false

outputs:
  snapshot_sha:
    description: Immutable pin-set commit supplied to the child
    value: ${{ steps.ignite.outputs.snapshot_sha }}
  execution_run_id:
    description: Exact child workflow run ID
    value: ${{ steps.ignite.outputs.execution_run_id }}

runs:
  using: composite
  steps:
    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
      with:
        bazelisk-version: '1.29.0'
        bazelisk-cache: true
        repository-cache: true
        disk-cache: true
        module-root: ${{ github.action_path }}/../../..
    - id: ignite
      run: bazel run //:ignition
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        SELECTION_MODE: ${{ inputs.selection_mode }}
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        SELECTION_PATH: ${{ runner.temp }}/pipeline-selection.json
        IMPLEMENTATION_REPOSITORY: ${{ github.action_repository }}
        IMPLEMENTATION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: source-selection-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/pipeline-selection.json
        if-no-files-found: warn
