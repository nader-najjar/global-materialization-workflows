name: Global Ignition
description: Placeholder; builds with Universal Build and fails until materialization is implemented

inputs:
  selection_mode:
    description: materialize or bounce
    required: true
  source_repository:
    description: Source repository to pin; omit for bounce
    required: false
  source_sha:
    description: Full source commit SHA; omit for bounce
    required: false

outputs:
  snapshot_sha:
    description: Immutable pin-set commit supplied to the child
    value: ${{ steps.ignite.outputs.snapshot_sha }}
  execution_run_id:
    description: Exact child workflow run ID
    value: ${{ steps.ignite.outputs.execution_run_id }}

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
    - run: ./universal-build build
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
    - id: ignite
      run: ./build/release/symlink-to-absolute-ignite-script/bin/ignite "$PWD/build/release/idiomatic-artifacts"
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
