name: Internal CI

on:
  workflow_call:
    inputs:
      selection_mode:
        description: dry_run, materialization, or bounce
        type: string
        required: true
      materializer_repository:
        description: Repository containing the source registry and saved pins
        type: string
        required: false
        default: ${{ github.repository }}
      materializer_ref:
        description: Exact ref from which to read .github/repositories.json
        type: string
        required: false
        default: ${{ github.sha }}
      source_repository:
        description: Registered source repository to override for this run
        type: string
        required: false
      source_sha:
        description: Full commit SHA to use for the source override
        type: string
        required: false

jobs:
  internal_source_selection:
    name: Internal Source Selection
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: internal-source-selection
      queue: max
    outputs:
      builds: ${{ steps.internal-source-selection.outputs.builds }}
    steps:
      - id: internal-source-selection
        uses: $/.github/actions/internal_source_selection
        with:
          selection_mode: ${{ inputs.selection_mode }}
          materializer_repository: ${{ inputs.materializer_repository }}
          materializer_ref: ${{ inputs.materializer_ref }}
          source_repository: ${{ inputs.source_repository }}
          source_sha: ${{ inputs.source_sha }}

  internal_build:
    name: Internal Build (${{ matrix.source_repository }}, ${{ matrix.runner }})
    needs: internal_source_selection
    if: needs.internal_source_selection.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.internal_source_selection.outputs.builds) }}
    uses: $/.github/workflows/internal_build.yml
    with:
      source_repository: ${{ matrix.source_repository }}
      source_sha: ${{ matrix.source_sha }}
      build_system: ${{ matrix.build_system }}
      runner: ${{ matrix.runner }}
