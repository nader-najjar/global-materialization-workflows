name: Global Universal Build System

on:
  workflow_call:
    inputs:
      source_repository:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      runner:
        type: string
        required: true

permissions:
  contents: read

jobs:
  global_universal_build_system:
    name: Global Universal Build System
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: ./universal-build build
      - run: jq -Rr '"ARTIFACT_NAMESPACE=" + (split("/") | join("--"))' <<< "$SOURCE_REPOSITORY" >> "$GITHUB_ENV"
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifact-${{ env.ARTIFACT_NAMESPACE }}-${{ inputs.source_sha }}
          path: build/release-artifact.tar.gz
          if-no-files-found: error
          overwrite: true
