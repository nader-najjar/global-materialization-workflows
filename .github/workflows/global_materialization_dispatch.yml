name: Global Materialization Dispatch

on:
  workflow_call:
    inputs:
      materializer_repository:
        description: Materializer repository in owner/repository format
        type: string
        required: true
      source_repository:
        description: Source repository in owner/repository format
        type: string
        required: true
      source_sha:
        description: Full source commit SHA to materialize
        type: string
        required: true
    secrets:
      MATERIALIZATION_DISPATCH_TOKEN:
        description: Token with Actions write access to the materializer repository
        required: true

permissions: {}

jobs:
  global_materialization_dispatch:
    name: Global Materialization Dispatch
    runs-on: ubuntu-24.04-arm
    steps:
      - run: gh workflow run materialization.yml --repo "$MATERIALIZER_REPOSITORY" --ref main -f "source_repository=$SOURCE_REPOSITORY" -f "source_sha=$SOURCE_SHA"
        env:
          MATERIALIZER_REPOSITORY: ${{ inputs.materializer_repository }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ secrets.MATERIALIZATION_DISPATCH_TOKEN }}
