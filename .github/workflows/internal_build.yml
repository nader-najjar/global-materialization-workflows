name: Internal Build

on:
  workflow_call:
    inputs:
      source_repository:
        description: Source repository in owner/repository format
        type: string
        required: true
      source_sha:
        description: Full source commit SHA to build
        type: string
        required: true
      build_system:
        description: Build system used by the source repository
        type: string
        required: true
      runner:
        description: GitHub runner label for the build
        type: string
        required: true

      selection_attempt:
        description: Run attempt in which this build was selected
        type: string
        required: true

permissions:
  contents: read

jobs:
  internal_build:
    name: Internal Build
    runs-on: ${{ inputs.runner }}
    steps:
      - if: github.run_attempt != 1 || inputs.selection_attempt != github.run_attempt
        run: |
          echo "::error::Submit a new materializer request instead of rerunning an execution."
          exit 1
      - if: inputs.build_system != 'universal'
        run: echo "::error::Only the universal build system is implemented"; exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - if: inputs.build_system == 'universal'
        uses: $/.github/actions/internal_universal_build
      - run: jq -Rr '"ARTIFACT_NAMESPACE=" + (split("/") | join("--"))' <<< "$SOURCE_REPOSITORY" >> "$GITHUB_ENV"
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      - id: release-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifact-${{ env.ARTIFACT_NAMESPACE }}-${{ inputs.source_sha }}-${{ inputs.runner }}
          path: build/release-artifact.tar.gz
          if-no-files-found: error
          overwrite: true
      - run: |
          jq -nr --arg id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" --arg url "$ARTIFACT_URL" \
            '"Release artifact: [" + $id + "](" + $url + ")\n\nDigest: `" + $digest + "`"' >> "$GITHUB_STEP_SUMMARY"
        env:
          ARTIFACT_ID: ${{ steps.release-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.release-artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.release-artifact.outputs.artifact-url }}
