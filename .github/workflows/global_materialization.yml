name: Global Materialization

on:
  workflow_call:
    inputs:
      source_repository:
        description: Registered source repository to update
        type: string
        required: true
      source_sha:
        description: Full commit SHA to save
        type: string
        required: true

permissions:
  contents: write

jobs:
  internal_ci:
    name: Internal CI
    uses: $/.github/workflows/internal_ci.yml
    with:
      selection_mode: materialization
      source_repository: ${{ inputs.source_repository }}
      source_sha: ${{ inputs.source_sha }}
